name: Build NullBounce Jar

on:
  workflow_dispatch: # Hello print

jobs:
  build:
    name: Build 1.8.9 Forge Client
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout repository code
        uses: actions/checkout@v4

      - name: 2. Set up Java 8 (Required for 1.8.9 Forge)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '8'

      - name: 3. Give execution permissions to Gradle wrapper
        run: chmod +x gradlew

      - name: 4. Build the Client Jar (Clean build)
        run: ./gradlew clean build --no-daemon

      - name: 5. Upload built JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: NullBounce-Recode
          path: build/libs/*.jar
