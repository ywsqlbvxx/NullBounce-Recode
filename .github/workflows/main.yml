name: Build NullBounce / LibreBounce Jar

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build 1.8.9 Forge Client
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '8'

      - name: Grant execution permissions to Gradle wrapper
        run: chmod +x gradlew

      - name: Build with explicit plugin versions
        run: ./gradlew clean build --no-daemon -Pforgegradle_version=a3d86a59c0 -Pmixingradle_version=ae2a80e

      - name: Upload compiled JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: LibreBounce-Client-Jar
          path: build/libs/*.jar
