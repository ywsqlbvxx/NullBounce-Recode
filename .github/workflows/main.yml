name: Build NullBounce Jar

on:
  workflow_dispatch:

jobs:
  build:
    name: Build 1.8.9 Forge Client
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Java 8 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '8'
          cache: 'gradle'

      - name: Grant execution permissions to Gradle wrapper
        run: chmod +x gradlew

      - name: Build client JAR
        run: ./gradlew build --no-daemon --refresh-dependencies

      - name: Upload compiled JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: NullBounce-R
          path: build/libs/*.jar
