name: Build NullBounce

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java 8 (Zulu)
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: 8
          cache: "gradle"

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew clean build --no-daemon

      - name: Rename artifact to NullBounce
        run: |
          mkdir -p build/output
          JAR_FILE=$(find build/libs -name "*.jar" ! -name "*-sources.jar" ! -name "*-dev.jar" | head -n 1)
          cp "$JAR_FILE" build/output/NullBounce.jar

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NullBounce-Client
          path: build/output/NullBounce.jar
