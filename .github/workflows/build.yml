name: Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java 8
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "8"
          cache: "gradle"

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Setup Forge Workspace
        run: ./gradlew --no-daemon setupCiWorkspace

      - name: Build client JAR
        run: ./gradlew --no-daemon clean build

      - name: Rename artifact
        run: |
          mkdir -p build/output
          JAR_FILE=$(find build/libs -name "librebounce-*.jar" ! -name "*-sources.jar" ! -name "*-dev.jar" | head -n 1)
          if [ -z "$JAR_FILE" ]; then
            JAR_FILE=$(find build/libs -name "*.jar" ! -name "*-sources.jar" ! -name "*-dev.jar" | head -n 1)
          fi
          cp "$JAR_FILE" build/output/NullBounce.jar

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NullBounce-Client
          path: build/output/NullBounce.jar
