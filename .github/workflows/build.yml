name: Build NullBounce Jar

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Build 1.8.9 Forge Client
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Java 8 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '8'
          cache: 'gradle'

      - name: Grant execution permissions to Gradle wrapper
        run: chmod +x gradlew

      - name: Initialize Workspace and Build
        run: |
          ./gradlew --no-daemon setupCiWorkspace --refresh-dependencies || true
          ./gradlew --no-daemon clean build --refresh-dependencies

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: NullBounce-Client
          path: build/libs/*.jar
