pluginManagement {
    repositories {
        maven { url = "https://jitpack.io" }
        mavenCentral()
        gradlePluginPortal()
        maven { url = "https://maven.minecraftforge.net" }
        maven { url = "https://repo.spongepowered.org/repository/maven-public/" }
    }
    resolutionStrategy {
        eachPlugin {
            switch (requested.id.id) {
                case "net.minecraftforge.gradle.forge":
                    useModule("com.github.SkidderMC:ForgeGradle:${forgegradle_version}")
                    break
                case "org.spongepowered.mixin":
                    useModule("com.github.xcfrg:${mixingradle_version}")
                    break
            }
        }
    }
    plugins {
        id "org.jetbrains.kotlin.jvm" version "2.0.21"
    }
}

rootProject.name = 'NullBounce-Recode'
